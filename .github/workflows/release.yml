name: Build release ZIP

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify and build
        run: |
          npm run doctor
          npm run check
          npm run build

      - name: Package source and dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          archive="${REPOSITORY_NAME}-${RELEASE_TAG}.zip"
          zip -r "$archive" . -x ".git/*" ".env" ".env.*" "*.log"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$ARCHIVE" --verify-tag --title "${{ github.event.repository.name }} ${{ github.ref_name }}" --notes "Dependency-free AIRC starter. The attached ZIP contains source files and the CI-built dist folder."
